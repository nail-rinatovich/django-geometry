databases:
  - name: aqua-db
    databaseName: aqua
    user: aqua
    plan: free

services:
  - type: web
    name: aqua
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./auqa/build.sh
    startCommand: ./auqa/start.sh
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aqua-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
